<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="DrDeepti double-booking prevention: two concurrent booking requests for the same slot both enter a transaction that selects the time slot for update while filtering on is_booked equals false. Postgres serializes them, so the first request creates the appointment and marks the slot booked, and the second finds no matching row and receives a 400 slot-unavailable response. A one-to-one foreign key from appointment to time slot acts as a database-level backstop underneath the lock.">

  <style><![CDATA[
    /* Fonts carry real fallbacks: a standalone SVG referenced as an image
       cannot fetch a webfont, so it renders in the fallback stack. */
    svg {
      color: #E4E8E1;
      --surface: #0D1524;
      --ink: #E4E8E1;
      --ink-soft: #98A194;
      --accent: #34D399;
      --ai: #E0906A;
      --gap: #CFAC55;
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    }
    .node     { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
    .zone     { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 4; opacity: .55; }
    .n-t      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); }
    .n-s      { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; fill: var(--ink-soft); }
    .z-t      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: var(--ink-soft); }
    .a-l      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: var(--ink-soft); }
    .edge     { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: .75; }
    .edge-acc { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .edge-gap { fill: none; stroke: var(--gap); stroke-width: 1.3; stroke-dasharray: 6 4; }
    .node-acc { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
    .node-gap { fill: none; stroke: var(--gap); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .gap-t    { fill: var(--gap); }
    .acc-t    { fill: var(--accent); }
    .rail     { fill: var(--accent); }
  ]]></style>

  <defs>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
    </marker>
    <marker id="ba-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"></path>
    </marker>
    <marker id="ba-gap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gap)"></path>
    </marker>
  </defs>

  <text class="z-t" x="20" y="32">TWO PATIENTS, ONE SLOT, THE SAME MILLISECOND</text>

  <rect class="node" x="20" y="70" width="200" height="66"></rect>
  <text class="n-t" x="36" y="96">request A</text>
  <text class="n-s" x="36" y="116">POST /appointments</text>

  <rect class="node" x="20" y="180" width="200" height="66"></rect>
  <text class="n-t" x="36" y="206">request B</text>
  <text class="n-s" x="36" y="226">same slot_id</text>

  <rect class="node-acc" x="300" y="70" width="360" height="176"></rect>
  <text class="n-t acc-t" x="318" y="98">transaction.atomic()</text>
  <text class="n-s" x="318" y="122">TimeSlot.objects</text>
  <text class="n-s" x="318" y="140">  .select_for_update()</text>
  <text class="n-s" x="318" y="158">  .get(id=slot_id,</text>
  <text class="n-s" x="318" y="176">       is_booked=False)</text>
  <text class="n-s acc-t" x="318" y="202">Postgres holds the row lock until</text>
  <text class="n-s acc-t" x="318" y="220">the first transaction commits —</text>
  <text class="n-s acc-t" x="318" y="238">the second never runs concurrently</text>

  <path class="edge" marker-end="url(#ba)" d="M 220 103 L 300 103"></path>
  <path class="edge" marker-end="url(#ba)" d="M 220 213 L 300 213"></path>

  <rect class="node-acc" x="740" y="70" width="440" height="66"></rect>
  <text class="n-t acc-t" x="758" y="96">201 · appointment created</text>
  <text class="n-s" x="758" y="116">Appointment row written, then is_booked = true</text>

  <rect class="node-gap" x="740" y="180" width="440" height="66"></rect>
  <text class="n-t gap-t" x="758" y="206">400 · slot unavailable</text>
  <text class="n-s gap-t" x="758" y="226">the row no longer matches is_booked = false</text>

  <path class="edge-acc" marker-end="url(#ba-acc)" d="M 660 103 L 740 103"></path>
  <path class="edge-gap" marker-end="url(#ba-gap)" d="M 660 213 L 740 213"></path>

  <text class="a-l acc-t" x="666" y="88">first</text>
  <text class="a-l gap-t" x="666" y="198">second</text>

  <rect class="node" x="300" y="320" width="880" height="90"></rect>
  <rect class="rail" x="300" y="320" width="3" height="90"></rect>
  <text class="n-t acc-t" x="320" y="348">the backstop underneath the lock</text>
  <text class="n-s" x="320" y="370">Appointment.slot is a OneToOneField(TimeSlot) — a unique constraint the database enforces.</text>
  <text class="n-s" x="320" y="388">Even if the lock were removed or bypassed, a second appointment for the same slot cannot be written.</text>

  <path class="edge" marker-end="url(#ba)" d="M 480 246 L 480 320"></path>

  <text class="a-l" x="20" y="460">The filter is inside the locked read, not after it. Selecting the row and then checking is_booked in Python would reintroduce exactly the race the lock exists to close —</text>
  <text class="a-l" x="20" y="478">two requests could both read an unbooked slot before either wrote. Here the second request's query simply matches nothing, and Django raises DoesNotExist.</text>
</svg>
