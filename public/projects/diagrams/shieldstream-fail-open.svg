<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="ShieldStream fail-open behaviour when Redis is unreachable: authentication falls from its Redis tenant cache through to Postgres, policy lookup falls from its Redis policy cache through to Postgres, and the rate limiter falls from its Redis sliding window to a per-process in-memory limiter. Each path costs one 0.2 second socket timeout, so a request still returns 200 in roughly one second rather than hanging. Measured across a three-phase chaos run: baseline 2,847 requests with zero failures, outage 1,333 requests with 67 failures traced to the test upstream, recovery 2,886 requests with one failure.">

  <style><![CDATA[
    /* Fonts carry real fallbacks: a standalone SVG referenced as an image
       cannot fetch a webfont, so it renders in the fallback stack. */
    svg {
      color: #E4E8E1;
      --surface: #0D1524;
      --ink: #E4E8E1;
      --ink-soft: #98A194;
      --accent: #34D399;
      --ai: #E0906A;
      --gap: #CFAC55;
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    }
    .node     { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
    .zone     { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 4; opacity: .55; }
    .n-t      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); }
    .n-s      { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; fill: var(--ink-soft); }
    .z-t      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: var(--ink-soft); }
    .a-l      { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: var(--ink-soft); }
    .edge-gap { fill: none; stroke: var(--gap); stroke-width: 1.3; stroke-dasharray: 6 4; }
    .edge     { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: .75; }
    .node-gap { fill: none; stroke: var(--gap); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .node-acc { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
    .gap-t    { fill: var(--gap); }
    .acc-t    { fill: var(--accent); }
    .rail     { fill: var(--accent); }
  ]]></style>

  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
    </marker>
    <marker id="fa-gap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gap)"></path>
    </marker>
  </defs>

  <text class="z-t" x="20" y="32">WHEN REDIS DIES · EVERY PATH DEGRADES, NONE FAIL</text>

  <text class="z-t" x="20" y="66">PATH</text>
  <text class="z-t" x="240" y="66">HEALTHY</text>
  <text class="z-t" x="580" y="66">REDIS UNREACHABLE</text>
  <text class="z-t" x="920" y="66">COST</text>

  <!-- Row 1 -->
  <rect class="node" x="20" y="80" width="200" height="76"></rect>
  <text class="n-t" x="36" y="110">authentication</text>
  <text class="n-s" x="36" y="130">runs first in the</text>
  <text class="n-s" x="36" y="146">dependency chain</text>

  <rect class="node" x="240" y="80" width="300" height="76"></rect>
  <text class="n-t" x="256" y="110">Redis tenant cache</text>
  <text class="n-s" x="256" y="130">30s TTL</text>

  <rect class="node-gap" x="580" y="80" width="300" height="76"></rect>
  <text class="n-t gap-t" x="596" y="110">Postgres lookup</text>
  <text class="n-s gap-t" x="596" y="130">still genuinely checks the key</text>
  <text class="n-s gap-t" x="596" y="146">cache write failures swallowed</text>

  <text class="a-l" x="920" y="116">+0.2s</text>

  <path class="edge" marker-end="url(#fa)" d="M 220 118 L 240 118"></path>
  <path class="edge-gap" marker-end="url(#fa-gap)" d="M 540 118 L 580 118"></path>

  <!-- Row 2 -->
  <rect class="node" x="20" y="180" width="200" height="76"></rect>
  <text class="n-t" x="36" y="210">policy lookup</text>
  <text class="n-s" x="36" y="230">per-tenant, per-route</text>

  <rect class="node" x="240" y="180" width="300" height="76"></rect>
  <text class="n-t" x="256" y="210">Redis policy cache</text>
  <text class="n-s" x="256" y="230">10s TTL · Pub/Sub invalidation</text>
  <text class="n-s" x="256" y="246">on top, never instead</text>

  <rect class="node-gap" x="580" y="180" width="300" height="76"></rect>
  <text class="n-t gap-t" x="596" y="210">Postgres lookup</text>
  <text class="n-s gap-t" x="596" y="230">the TTL is the backstop that</text>
  <text class="n-s gap-t" x="596" y="246">catches every missed message</text>

  <text class="a-l" x="920" y="216">+0.2s</text>

  <path class="edge" marker-end="url(#fa)" d="M 220 218 L 240 218"></path>
  <path class="edge-gap" marker-end="url(#fa-gap)" d="M 540 218 L 580 218"></path>

  <!-- Row 3 -->
  <rect class="node" x="20" y="280" width="200" height="76"></rect>
  <text class="n-t" x="36" y="310">rate limiter</text>
  <text class="n-s" x="36" y="330">availability over strict</text>
  <text class="n-s" x="36" y="346">enforcement</text>

  <rect class="node-acc" x="240" y="280" width="300" height="76"></rect>
  <text class="n-t acc-t" x="256" y="310">Redis sliding window</text>
  <text class="n-s" x="256" y="330">sorted set + atomic Lua script</text>
  <text class="n-s" x="256" y="346">distributed across replicas</text>

  <rect class="node-gap" x="580" y="280" width="300" height="76"></rect>
  <text class="n-t gap-t" x="596" y="310">in-memory limiter</text>
  <text class="n-s gap-t" x="596" y="330">per-process, so the effective</text>
  <text class="n-s gap-t" x="596" y="346">limit multiplies by replica count</text>

  <text class="a-l" x="920" y="316">+0.2s</text>

  <path class="edge" marker-end="url(#fa)" d="M 220 318 L 240 318"></path>
  <path class="edge-gap" marker-end="url(#fa-gap)" d="M 540 318 L 580 318"></path>

  <!-- Summary -->
  <rect class="zone" x="20" y="390" width="1160" height="128"></rect>
  <text class="z-t" x="40" y="416">MEASURED, BY ACTUALLY STOPPING THE CONTAINER MID-TRAFFIC</text>
  <text class="a-l" x="40" y="442">Every request still returns 200, bounded at roughly one second — three short timeouts stacking across authentication, policy and the limiter,</text>
  <text class="a-l" x="40" y="460">not the thirty-second OS-level TCP hang that an unconfigured client produced before the timeouts were added.</text>
  <text class="a-l" x="40" y="486">Baseline 2,847 requests, 0 failures  ·  outage 1,333 requests, 67 failures (5.0%)  ·  recovery 2,886 requests, 1 failure (0.03%).</text>
  <text class="a-l gap-t" x="40" y="504">Those 67 traced to the single-worker test upstream's own concurrency ceiling, not to any fail-open path — no uncaught exception was ever raised.</text>
</svg>
